# Transposable element quantification. Kept separate from environment.yml because
# TEtranscripts pins an older pysam/numpy than the main environment wants, and
# resolving them together forces avoidable downgrades on the gene-level path.
#
# TEtranscripts comes from pip rather than bioconda: the bioconda package depends on
# bioconductor-deseq (DESeq1), which has no osx-arm64 build, and TEcount itself only
# needs pysam. samtools is unpinned because 1.19 has no osx-arm64 build.
name: bulk-rnaseq-te
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - samtools
  - pip
  - pip:
      - TEtranscripts==2.2.4
