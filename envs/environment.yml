# Upstream environment: read QC, trimming, alignment and quantification.
# Create with:  mamba env create -f envs/environment.yml -n bulk-rnaseq
#
# Versions were current as of 2026-08 and are pinned for reproducibility rather than
# frozen forever - re-check with `mamba search <pkg>` and bump deliberately.
name: bulk-rnaseq
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10,<3.12   # snakemake 7.32 fails to parse rules on 3.12 (f-string SyntaxError)
  - snakemake>=7.32,<8
  - salmon=2.6
  - fastp=1.3
  - fastqc
  - multiqc
  - samtools=1.23
  # STAR lives in envs/star.yml, not here. Its only osx-arm64 version (2.7.11b) is linked
  # against htslib 1.21-1.22, which cannot coexist with samtools 1.23 and fastp 1.3 on
  # Apple Silicon. Snakemake builds that env itself for the STAR rules (--use-conda).
